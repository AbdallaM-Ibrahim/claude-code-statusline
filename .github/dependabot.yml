# Keeps go.mod and the workflow actions current so the vulncheck CI gate does
# not fail on a stale toolchain or an x/net advisory nobody noticed. Go
# toolchain patch releases are picked up through the gomod ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
